<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- CANI Maritime Red Squircle -->
  <rect width="64" height="64" rx="14" fill="#C0392B"/>
  
  <!-- 3 Overlapping Maritime Diamonds -->
  <polygon points="16,16 27,32 16,48 5,32" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
  <polygon points="32,16 43,32 32,48 21,32" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
  <polygon points="48,16 59,32 48,48 37,32" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
  
  <!-- Monogram Letters C N I -->
  <text x="16" y="36.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">C</text>
  <text x="32" y="36.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">N</text>
  <text x="48" y="36.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">I</text>
</svg>
